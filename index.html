<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pentru Bianca ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="stars"></div>
<div class="rose-petals"></div>

<section class="hero">

<div class="glass">

<h2>Pentru</h2>

<h1>Bianca ❤️</h1>

<p class="subtitle">
Am făcut pagina asta pentru că un simplu
<b>„Îmi pare rău”</b>
nu mi s-a părut suficient...
</p>

<button id="start">
Citește mesajul
</button>

</div>

</section>

<section class="message hidden" id="message">

<div class="card">

<h2>Din partea lui Valentin</h2>

<p id="typing"></p>

<button id="forgive">
🤍 Te rog să mă ierți
</button>

</div>

</section>

<div class="popup" id="popup">

<div class="popup-box">

<h2>Mulțumesc ❤️</h2>

<p>
Indiferent de răspunsul tău,
îți mulțumesc că ai citit până la capăt.

Îmi pare sincer rău.
</p>

<button onclick="closePopup()">
Închide
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
